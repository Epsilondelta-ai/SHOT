# Rate limiting zones — loaded at http{} context level
# Stored in shared memory; 10m ≈ 160,000 IP entries

# Auth endpoints: 20 requests/min per IP
# Covers login typos, OAuth 3-step flow, retry scenarios
limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=20r/m;

# General API: 10 requests/sec per IP
# Covers burst page loads (~5 reqs), bot developers with multiple bots
limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=10r/s;

# SSE connections: max concurrent connections per IP
# Each player: 2 SSE (session + room). Bot developer: 1 SSE per bot.
# 50 bots + own 2 player connections = 52 → limit set to 60 for headroom
limit_conn_zone $binary_remote_addr zone=sse_zone:10m;

# Log format that strips query parameters (?token=...) from access logs
# Prevents JWT tokens from being written to disk in plaintext
log_format main_masked '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
